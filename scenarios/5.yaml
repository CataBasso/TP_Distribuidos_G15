# Generado por tools/scenarios.py -- clients=3 gw=1 year=1 q1=1 q2=1 img=1 ac=2 lm=1 wm=2 P=2 A=1 K=1 sup=0
services:
  rabbitmq:
    image: tpdist/rabbitmq:latest
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    cpus: "2.0"
    restart: unless-stopped
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  gateway_0:
    image: tpdist/gateway:latest
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway_0
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - GATEWAY_ID=1
    - GATEWAY_PORT=5000
    - RABBIT_HOST=rabbitmq
    - WORD_PARTITIONS=2
    - Q5_PARTITIONS=1
    - PYTHONUNBUFFERED=1
    - STATE_DIR=/state
    - FAILPOINTS=${FP_GATEWAY_0:-}
    volumes:
    - gateway_0_state:/state
  year_filter_0:
    image: tpdist/year_filter:latest
    build:
      context: ./src/
      dockerfile: filters/year_filter/Dockerfile
    container_name: year_filter_0
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=year_in
    - Q1_QUEUE=q1_in
    - Q2_QUEUE=q2_in
    - NORM_QUEUE=norm_in
    - PYTHONUNBUFFERED=1
    - FAILPOINTS=${FP_YEAR_FILTER_0:-}
  q1_filter_0:
    image: tpdist/q1_filter:latest
    build:
      context: ./src/
      dockerfile: filters/q1_filter/Dockerfile
    container_name: q1_filter_0
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=q1_in
    - PYTHONUNBUFFERED=1
    - FAILPOINTS=${FP_Q1_FILTER_0:-}
  q2_filter_0:
    image: tpdist/q2_filter:latest
    build:
      context: ./src/
      dockerfile: filters/q2_filter/Dockerfile
    container_name: q2_filter_0
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=q2_in
    - OUTPUT_QUEUE=img_in
    - PYTHONUNBUFFERED=1
    - FAILPOINTS=${FP_Q2_FILTER_0:-}
  image_getter_0:
    image: tpdist/image_getter:latest
    build:
      context: ./src/
      dockerfile: image/Dockerfile
    container_name: image_getter_0
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=img_in
    - PYTHONUNBUFFERED=1
    - FAILPOINTS=${FP_IMAGE_GETTER_0:-}
  abstract_cleaner_0:
    image: tpdist/abstract_cleaner:latest
    build:
      context: ./src/
      dockerfile: text_processing/abstract_cleaner/Dockerfile
    container_name: abstract_cleaner_0
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=norm_in
    - PYTHONUNBUFFERED=1
    - STATE_DIR=/state
    - FAILPOINTS=${FP_ABSTRACT_CLEANER_0:-}
    volumes:
    - abstract_cleaner_0_state:/state
  abstract_cleaner_1:
    image: tpdist/abstract_cleaner:latest
    pull_policy: never
    container_name: abstract_cleaner_1
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=1
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=norm_in
    - PYTHONUNBUFFERED=1
    - STATE_DIR=/state
    - FAILPOINTS=${FP_ABSTRACT_CLEANER_1:-}
    volumes:
    - abstract_cleaner_1_state:/state
  length_mapper_0:
    image: tpdist/length_mapper:latest
    build:
      context: ./src/
      dockerfile: text_processing/length_mapper/Dockerfile
    container_name: length_mapper_0
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - CLEANER_REPLICAS=2
    - AVG_PARTITIONS=1
    - Q5_PARTITIONS=1
    - PYTHONUNBUFFERED=1
    - STATE_DIR=/state
    - FAILPOINTS=${FP_LENGTH_MAPPER_0:-}
    volumes:
    - length_mapper_0_state:/state
  avg_reducer_0:
    image: tpdist/avg_reducer:latest
    build:
      context: ./src/
      dockerfile: text_processing/avg_reducer/Dockerfile
    container_name: avg_reducer_0
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - LM_REPLICAS=1
    - Q5_PARTITIONS=1
    - PYTHONUNBUFFERED=1
    - STATE_DIR=/state
    - FAILPOINTS=${FP_AVG_REDUCER_0:-}
    volumes:
    - avg_reducer_0_state:/state
  q5_filter_0:
    image: tpdist/q5_filter:latest
    build:
      context: ./src/
      dockerfile: filters/q5_filter/Dockerfile
    container_name: q5_filter_0
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - LM_REPLICAS=1
    - PYTHONUNBUFFERED=1
    - STATE_DIR=/state
    - FAILPOINTS=${FP_Q5_FILTER_0:-}
    volumes:
    - q5_filter_0_state:/state
  word_mapper_0:
    image: tpdist/word_mapper:latest
    build:
      context: ./src/
      dockerfile: text_processing/word_mapper/Dockerfile
    container_name: word_mapper_0
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - CLEANER_REPLICAS=2
    - WORD_PARTITIONS=2
    - PYTHONUNBUFFERED=1
    - STATE_DIR=/state
    - FAILPOINTS=${FP_WORD_MAPPER_0:-}
    volumes:
    - word_mapper_0_state:/state
  word_mapper_1:
    image: tpdist/word_mapper:latest
    pull_policy: never
    container_name: word_mapper_1
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=1
    - MOM_HOST=rabbitmq
    - CLEANER_REPLICAS=2
    - WORD_PARTITIONS=2
    - PYTHONUNBUFFERED=1
    - STATE_DIR=/state
    - FAILPOINTS=${FP_WORD_MAPPER_1:-}
    volumes:
    - word_mapper_1_state:/state
  word_reducer_0:
    image: tpdist/word_reducer:latest
    build:
      context: ./src/
      dockerfile: text_processing/word_reducer/Dockerfile
    container_name: word_reducer_0
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - WM_REPLICAS=2
    - PYTHONUNBUFFERED=1
    - STATE_DIR=/state
    - FAILPOINTS=${FP_WORD_REDUCER_0:-}
    volumes:
    - word_reducer_0_state:/state
  word_reducer_1:
    image: tpdist/word_reducer:latest
    pull_policy: never
    container_name: word_reducer_1
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=1
    - MOM_HOST=rabbitmq
    - WM_REPLICAS=2
    - PYTHONUNBUFFERED=1
    - STATE_DIR=/state
    - FAILPOINTS=${FP_WORD_REDUCER_1:-}
    volumes:
    - word_reducer_1_state:/state
  top_merger:
    image: tpdist/top_merger:latest
    build:
      context: ./src/
      dockerfile: text_processing/top_merger/Dockerfile
    container_name: top_merger
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - MOM_HOST=rabbitmq
    - WORD_PARTITIONS=2
    - PYTHONUNBUFFERED=1
    - STATE_DIR=/state
    - FAILPOINTS=${FP_TOP_MERGER:-}
    volumes:
    - top_merger_state:/state
  client_0:
    image: tpdist/client:latest
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    profiles: ["clients"]
    depends_on:
    - gateway_0
    environment:
    - GATEWAY_HOST=gateway_0
    - GATEWAY_PORT=5000
    - DATA_DIR=/data
    - OUTPUT_DIR=/output/client_0
    - PYTHONUNBUFFERED=1
    volumes:
    - ./data/sample/small_dataset:/data:ro
    - ./output:/output
  client_1:
    image: tpdist/client:latest
    pull_policy: never
    container_name: client_1
    profiles: ["clients"]
    depends_on:
    - gateway_0
    environment:
    - GATEWAY_HOST=gateway_0
    - GATEWAY_PORT=5000
    - DATA_DIR=/data
    - OUTPUT_DIR=/output/client_1
    - PYTHONUNBUFFERED=1
    volumes:
    - ./data/sample/small_dataset:/data:ro
    - ./output:/output
  client_2:
    image: tpdist/client:latest
    pull_policy: never
    container_name: client_2
    profiles: ["clients"]
    depends_on:
    - gateway_0
