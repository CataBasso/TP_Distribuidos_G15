  abstract_cleaner_0_state:
  abstract_cleaner_1_state:
  length_mapper_0_state:
  avg_reducer_0_state:
  q5_filter_0_state:
  word_mapper_0_state:
  word_mapper_1_state:
  word_reducer_0_state:
  word_reducer_1_state:
  top_merger_state:
