# Generado por tools/scenarios.py -- clients=3 year=1 q1=1 q2=1 img=1 ac=2 lm=2 wm=1 P=1 A=2 K=2
services:
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - GATEWAY_ID=1
    - GATEWAY_PORT=5000
    - RABBIT_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
  joiner:
    build:
      context: ./src/
      dockerfile: results/Dockerfile
    container_name: joiner
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - GW_ID=1
    - MOM_HOST=rabbitmq
    - WORD_PARTITIONS=1
    - Q5_PARTITIONS=2
    - PYTHONUNBUFFERED=1
  year_filter_0:
    build:
      context: ./src/
      dockerfile: filters/year_filter/Dockerfile
    container_name: year_filter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=year_in
    - Q1_QUEUE=q1_in
    - Q2_QUEUE=q2_in
    - NORM_QUEUE=norm_in
    - PYTHONUNBUFFERED=1
  q1_filter_0:
    build:
      context: ./src/
      dockerfile: filters/q1_filter/Dockerfile
    container_name: q1_filter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=q1_in
    - PYTHONUNBUFFERED=1
  q2_filter_0:
