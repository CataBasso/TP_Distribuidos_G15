      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=q2_in
    - OUTPUT_QUEUE=img_in
    - PYTHONUNBUFFERED=1
  image_getter_0:
    build:
      context: ./src/
      dockerfile: image/Dockerfile
    container_name: image_getter_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=img_in
    - PYTHONUNBUFFERED=1
  abstract_cleaner_0:
