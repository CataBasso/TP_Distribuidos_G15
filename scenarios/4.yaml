      dockerfile: text_processing/abstract_cleaner/Dockerfile
    container_name: abstract_cleaner_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=norm_in
    - PYTHONUNBUFFERED=1
  abstract_cleaner_1:
