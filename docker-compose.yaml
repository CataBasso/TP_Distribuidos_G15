# Generado por tools/scenarios.py -- clients=3 gw=4 year=4 q1=4 q2=4 img=4 ac=4 lm=3 wm=4 P=4 A=4 K=4
services:
  rabbitmq:
    image: tpdist/rabbitmq:latest
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    cpus: "2.0"
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  gateway_0:
    image: tpdist/gateway:latest
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway_0
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - GATEWAY_ID=1
    - GATEWAY_PORT=5000
    - RABBIT_HOST=rabbitmq
    - WORD_PARTITIONS=4
    - Q5_PARTITIONS=4
    - PYTHONUNBUFFERED=1
  gateway_1:
    image: tpdist/gateway:latest
    pull_policy: never
    container_name: gateway_1
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - GATEWAY_ID=2
    - GATEWAY_PORT=5000
    - RABBIT_HOST=rabbitmq
    - WORD_PARTITIONS=4
    - Q5_PARTITIONS=4
