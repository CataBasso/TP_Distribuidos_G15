services:
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - GATEWAY_ID=1
    - GATEWAY_PORT=5000
    - RABBIT_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
  joiner:
    build:
      context: ./src/
      dockerfile: results/Dockerfile
    container_name: joiner
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - GW_ID=1
    - MOM_HOST=rabbitmq
    - WORD_PARTITIONS=1
    - Q5_PARTITIONS=1
    - PYTHONUNBUFFERED=1
  year_filter:
    build:
      context: ./src/
      dockerfile: filters/year_filter/Dockerfile
    container_name: year_filter
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=year_in
    - Q1_QUEUE=q1_in
    - Q2_QUEUE=q2_in
    - NORM_QUEUE=norm_in
    - PYTHONUNBUFFERED=1
  q1_filter:
    build:
      context: ./src/
      dockerfile: filters/q1_filter/Dockerfile
    container_name: q1_filter
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=q1_in
    - PYTHONUNBUFFERED=1
  q2_filter:
    build:
      context: ./src/
      dockerfile: filters/q2_filter/Dockerfile
    container_name: q2_filter
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=q2_in
    - OUTPUT_QUEUE=img_in
    - PYTHONUNBUFFERED=1
  image_getter:
    build:
      context: ./src/
      dockerfile: image/Dockerfile
    container_name: image_getter
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - INPUT_QUEUE=img_in
    - PYTHONUNBUFFERED=1
  length_mapper:
    build:
      context: ./src/
      dockerfile: text_processing/length_mapper/Dockerfile
    container_name: length_mapper
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - CLEANER_REPLICAS=1
    - AVG_PARTITIONS=1
    - Q5_PARTITIONS=1
    - PYTHONUNBUFFERED=1
  avg_reducer:
    build:
      context: ./src/
      dockerfile: text_processing/avg_reducer/Dockerfile
    container_name: avg_reducer
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - LM_REPLICAS=1
    - Q5_PARTITIONS=1
    - PYTHONUNBUFFERED=1
  q5_filter:
    build:
      context: ./src/
      dockerfile: filters/q5_filter/Dockerfile
    container_name: q5_filter
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - ID=0
    - MOM_HOST=rabbitmq
    - LM_REPLICAS=1
    - PYTHONUNBUFFERED=1
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
    - gateway
    - joiner
    environment:
    - GATEWAY_HOST=gateway
    - GATEWAY_PORT=5000
    - DATA_DIR=/data
    - OUTPUT_DIR=/output
    - PYTHONUNBUFFERED=1
    volumes:
    - ./data/sample/small_dataset:/data:ro
    - ./output:/output
